name: personalboard

services:
    app:
        build:
            context: .
        restart: unless-stopped
        volumes:
            - .:/var/www/html
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - personalboard

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - personalboard

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: personalboard
            MYSQL_USER: personalboard
            MYSQL_PASSWORD: personalboard
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - personalboard

    phpmyadmin:
        image: phpmyadmin:5-apache
        restart: unless-stopped
        ports:
            - "8081:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            UPLOAD_LIMIT: 64M
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - personalboard

volumes:
    mysql-data:
        name: personalboard_fresh_mysql_data

networks:
    personalboard:
        driver: bridge
